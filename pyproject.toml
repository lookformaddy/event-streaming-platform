[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-streaming-platform"
version = "1.0.0"
description = "Schema-validated event streaming platform: topics, partitions, consumer groups, exactly-once semantics, replay, and dead-letter queues — deterministic in-process engine, no external services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9", "httpx>=0.27,<1"]

[project.scripts]
event-stream = "eventstream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
